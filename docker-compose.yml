services:
  # MongoDB Database
  mongo:
    image: ghcr.io/castorfou/lmelp-mongo:latest
    container_name: lmelp-mongo
    restart: unless-stopped
    command: ["mongod", "--config", "/etc/mongod.conf"]
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - ${MONGO_DATA_PATH:-./data/mongodb}:/data/db
      - ${BACKUP_PATH:-./data/backups}:/backups
      - ${MONGO_LOG_PATH:-./data/mongodb-logs}:/var/log/mongodb
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-masque_et_la_plume}
    healthcheck:
      # HOME=/tmp: the mongo image sets HOME=/data/db (the data volume), where
      # mongosh would otherwise write its per-session files every 10 s (#69).
      test: ["CMD-SHELL", "HOME=/tmp mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lmelp-network

  # PGX SSH key permissions watchdog — auto-répare les droits de la clé privée si un
  # mécanisme externe (ex: synchro ACL Synology) les réinitialise (issue #61).
  # Couvre la clé dédiée backend (pgx_ed25519, issue #66) et la clé historique
  # de l'ancien service Streamlit lmelp (pgx_lmelp_ed25519, retiré en #71),
  # conservée sur le volume PGX_KEYS_PATH.
  pgx-keys-watchdog:
    image: alpine:latest
    container_name: lmelp-pgx-keys-watchdog
    restart: unless-stopped
    volumes:
      - ${PGX_KEYS_PATH:-./data/pgx-keys}:/keys
      - ${PGX_BACKEND_KEYS_PATH:-./data/pgx-keys-backend}:/keys-backend
    command: >
      sh -c '
      while true; do
        chmod 600 /keys/pgx_lmelp_ed25519 2>/dev/null;
        chmod 644 /keys/pgx_lmelp_ed25519.pub 2>/dev/null;
        chmod 600 /keys-backend/pgx_ed25519 2>/dev/null;
        chmod 644 /keys-backend/pgx_ed25519.pub 2>/dev/null;
        sleep "${PGX_KEYS_WATCHDOG_INTERVAL:-300}";
      done'
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lmelp-network

  # Back-Office Backend API
  backend:
    image: ghcr.io/castorfou/lmelp-backend:latest
    container_name: lmelp-backoffice-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - mongo
    volumes:
      - ${CALIBRE_HOST_PATH:-/dev/null}:/calibre:ro
      - ${BABELIO_CACHE_PATH:-./data/cache/babelio}:/cache/babelio
      - ${AUDIO_PATH:-./data/audios}:/app/audios
      - ${PGX_BACKEND_KEYS_PATH:-./data/pgx-keys-backend}:/app/keys
    environment:
      # Utilisateur non-root (fichiers de cache Babelio créés avec cet UID/GID sur l'hôte)
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

      - MONGODB_URL=mongodb://mongo:27017/${MONGO_DATABASE:-masque_et_la_plume}
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # LLM API Keys - Azure OpenAI
      - AZURE_API_KEY=${AZURE_API_KEY:-}
      - AZURE_ENDPOINT=${AZURE_ENDPOINT:-}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-}
      - AZURE_DEPLOYMENT_NAME=${AZURE_DEPLOYMENT_NAME:-}
      # Calibre integration (optionnel)
      - CALIBRE_VIRTUAL_LIBRARY_TAG=${CALIBRE_VIRTUAL_LIBRARY_TAG:-}
      # Synchronisation RSS automatisée (POST /api/rss/sync, cf. back-office-lmelp#295)
      - AUDIO_STORAGE_PATH=/app/audios
      - RSS_MASQUE_ET_LA_PLUME_URL=${RSS_MASQUE_ET_LA_PLUME_URL:-https://radiofrance-podcast.net/podcast09/rss_14007.xml}
      - RSS_DUREE_MINI_MINUTES=${RSS_DUREE_MINI_MINUTES:-15}
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      # Cache Babelio (persisté entre redéploiements)
      - BABELIO_CACHE_DIR=/cache/babelio
      - BABELIO_FAIR_SEC=${BABELIO_FAIR_SEC:-2.0}
      - BABELIO_CACHE_DAY=${BABELIO_CACHE_DAY:-30}
      # PGX - Transcription automatisée (station GPU dédiée, cf. back-office-lmelp#302)
      # Clé SSH dédiée au backend (distincte de la clé historique
      # pgx_lmelp_ed25519, cf. issue #66).
      - PGX_HOST=${PGX_HOST:-}
      - PGX_USER=${PGX_USER:-}
      - PGX_SSH_KEY_PATH=/app/keys/pgx_ed25519
      - PGX_REMOTE_AUDIO_ROOT=${PGX_REMOTE_AUDIO_ROOT:-}
      - PGX_REMOTE_TRANSCRIPTION_ROOT=${PGX_REMOTE_TRANSCRIPTION_ROOT:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lmelp-network

  # Back-Office Frontend (Web UI)
  frontend:
    image: ghcr.io/castorfou/lmelp-frontend:latest
    container_name: lmelp-backoffice-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lmelp-network

  # LMELP Export Service (Android ADB)
  lmelp-export:
    image: ghcr.io/castorfou/lmelp-mobile-export:latest
    container_name: lmelp-export
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ${CALIBRE_HOST_PATH:-/dev/null}:/calibre:ro
      # publish-loop writes /var/log/publish-data-release.log inside the
      # container; without this volume the log never reaches the host.
      # Default kept under ./data/logs for existing deployments. Nesting is
      # harmless: this container runs as root and no other service chowns
      # ./data/logs (see issue #51 rule in CLAUDE.md).
      - ${LMELP_EXPORT_LOG_PATH:-./data/logs/lmelp-export}:/var/log
      # ok/failed state of the publish loop (last_status). Without it, a
      # container recreated during an outage restarts from "ok" and the
      # ntfy recovery notification is never sent (issue #77).
      - ${LMELP_EXPORT_STATE_PATH:-./data/logs/lmelp-export-state}:/var/lib/lmelp-export
    environment:
      - LMELP_MONGO_URI=mongodb://mongo:27017
      - LMELP_CALIBRE_DB=/calibre/metadata.db
      - LMELP_CALIBRE_VIRTUAL_LIBRARY=${CALIBRE_VIRTUAL_LIBRARY_TAG:-guillaume}
      - ADB_HOST=${ADB_HOST:-host-gateway}
      - ADB_PORT=${ADB_PORT:-5037}
      # GitHub token used by 'export-and-publish-release' (gh release upload
      # to the 'data-v{N}' release of castorfou/lmelp-mobile, N = Room schema)
      - GH_TOKEN=${GH_TOKEN:-}
      # publish-loop runs export-and-publish-release every PUBLISH_INTERVAL
      # seconds (0 disables it) and notifies ntfy on each publication, on the
      # first failure and on recovery (lmelp-mobile#153). Same ntfy variables
      # as backend: shared topic, titles prefixed "lmelp-mobile - ".
      - PUBLISH_INTERVAL=${PUBLISH_INTERVAL:-3600}
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
    extra_hosts:
      - "host-gateway:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import pymongo; pymongo.MongoClient('mongodb://mongo:27017').admin.command('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lmelp-network


networks:
  lmelp-network:
    driver: bridge
