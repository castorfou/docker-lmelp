name: 🐳 Build and Publish MongoDB Image

on:
  push:
    branches: [main, master]
    paths:
      - 'mongodb.Dockerfile'
      - 'config/mongod.conf'
      - 'config/anacrontab'
      - 'scripts/backup_mongodb.sh'
      - 'scripts/rotate_mongodb_logs.sh'
      - '.github/workflows/build-mongo-image.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'mongodb.Dockerfile'
      - 'config/mongod.conf'
      - 'config/anacrontab'
      - 'scripts/backup_mongodb.sh'
      - 'scripts/rotate_mongodb_logs.sh'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lmelp-mongo

jobs:
  build-and-push:
    name: 🏗️ Build and Push MongoDB Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr,prefix=pr-
            type=sha,prefix=sha-

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./mongodb.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: ✅ Image published
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ MongoDB image published to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

      - name: 🔄 Mise à jour sur le NAS (Watchtower)
        # Watchtower (castorfou/dockers) pull l'image et redémarre les conteneurs labellisés qui l'utilisent.
        # Échoue si aucun conteneur ne correspond (scanned=0) ou si la mise à jour échoue.
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
          IMAGES: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          resp=$(curl -fsS --retry 3 --retry-delay 10 --max-time 660 -X POST \
            -H "Authorization: Bearer $WATCHTOWER_TOKEN" \
            "https://watchtower.ascot63.synology.me/v1/update?image=$IMAGES")
          echo "$resp"
          jq -e '.summary.scanned >= 1 and .summary.failed == 0' <<< "$resp"
